<!doctype html>
<html lang="en">

<meta name="robots" content="noindex, nofollow">
<meta name="description" content="IREO Pocket Brief: an open-source commander's brief on a foreign military.">
<meta name="theme-color" content="#10161c">
<link rel="icon" href="data:,">
<title>Pocket Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed status header; desktop = contents rail · stage page · sources aside; phone = one column,
   sticky stage sub-nav, five bottom tabs (Brief · Collect · Analyse · Present · Sources). Dark-first, soft contrast. */
:root {
  color-scheme: dark;
  --bg: #10161c;
  --bg-raised: #161f27;
  --bg-raised-2: #1b2530;
  --bg-sunk: #0c1116;
  --bg-hover: #1d2833;
  --line: rgba(214, 226, 238, .08);
  --line-strong: rgba(214, 226, 238, .17);
  --fg: #e1e7ec;
  --fg-2: #a9b4bd;
  --fg-3: #808c96;
  --accent: #90baef;
  --accent-wash: rgba(144, 186, 239, .13);
  --solid-bg: #cdd7df;
  --solid-fg: #10161c;
  --good: #63c98e; --good-wash: rgba(99, 201, 142, .12);
  --warn: #e3b052; --warn-wash: rgba(227, 176, 82, .13);
  --bad: #ef7f78; --bad-wash: rgba(239, 127, 120, .13);
  --bar: #3a4a57;
  --map-land: #18212a; --map-focus: #22303d; --map-edge: rgba(214, 226, 238, .2);
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9;
  --scrim: rgba(4, 8, 12, .6);
  --shadow: 0 18px 50px rgba(0, 0, 0, .5);
  --font-display: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gutter: 16px;
  --rail-w: 268px;
  --hdr-h: 118px; --hdr-full: 118px; --hdr-cmp: 58px;
  --tab-h: 62px;
  --radius: 14px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f3f5f7; --bg-raised: #ffffff; --bg-raised-2: #f7f9fa; --bg-sunk: #e9edf0; --bg-hover: #eef2f5;
    --line: rgba(16, 26, 36, .08); --line-strong: rgba(16, 26, 36, .17);
    --fg: #17212b; --fg-2: #47545f; --fg-3: #63707b;
    --accent: #1f5fb8; --accent-wash: rgba(31, 95, 184, .09);
    --solid-bg: #1f2c37; --solid-fg: #ffffff;
    --good: #157a3d; --good-wash: rgba(21, 122, 61, .09);
    --warn: #8f5b00; --warn-wash: rgba(176, 112, 0, .11);
    --bad: #b3322f; --bad-wash: rgba(179, 50, 47, .09);
    --bar: #b8c5cf;
    --map-land: #e4e9ed; --map-focus: #ffffff; --map-edge: rgba(16, 26, 36, .22);
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #6250d6;
    --scrim: rgba(15, 23, 29, .36);
    --shadow: 0 18px 50px rgba(20, 35, 50, .18);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f5f7; --bg-raised: #ffffff; --bg-raised-2: #f7f9fa; --bg-sunk: #e9edf0; --bg-hover: #eef2f5;
  --line: rgba(16, 26, 36, .08); --line-strong: rgba(16, 26, 36, .17);
  --fg: #17212b; --fg-2: #47545f; --fg-3: #63707b;
  --accent: #1f5fb8; --accent-wash: rgba(31, 95, 184, .09);
  --solid-bg: #1f2c37; --solid-fg: #ffffff;
  --good: #157a3d; --good-wash: rgba(21, 122, 61, .09);
  --warn: #8f5b00; --warn-wash: rgba(176, 112, 0, .11);
  --bad: #b3322f; --bad-wash: rgba(179, 50, 47, .09);
  --bar: #b8c5cf;
  --map-land: #e4e9ed; --map-focus: #ffffff; --map-edge: rgba(16, 26, 36, .22);
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #6250d6;
  --scrim: rgba(15, 23, 29, .36);
  --shadow: 0 18px 50px rgba(20, 35, 50, .18);
}
:root[data-theme="dark"] { color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.muted { color: var(--fg-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header (fixed, same height at every scroll position) ---------- */
.hdr { position: fixed; top: 0; left: 0; right: 0; z-index: 30; padding-top: env(safe-area-inset-top, 0px); background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: saturate(1.2) blur(14px); backdrop-filter: saturate(1.2) blur(14px); border-bottom: 1px solid var(--line); }
.osbar { font: 500 10px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; text-align: center; padding: 6px 16px; color: var(--fg-3); border-bottom: 1px solid var(--line); }
.osbar b { color: var(--fg-2); font-weight: 500; }
.hdr-in { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id act" "state state"; gap: 10px 12px; padding: 10px var(--gutter) 12px; align-items: center; }
.hdr-id { grid-area: id; display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; }
.iso { font: 700 12.5px/1 var(--font-display); letter-spacing: .1em; padding: 6px 6px 5px 7px; border: 1.5px solid var(--fg); border-radius: 3px; flex: none; }
/* National flag in place of the ISO badge: a hairline keeps a white band visible on a light page. */
.flag { flex: none; display: block; width: 36px; height: auto; aspect-ratio: auto 8 / 5; object-fit: cover; border-radius: 3px; box-shadow: 0 0 0 1px var(--line-strong); background: var(--bg-sunk); }
.hdr-name { min-width: 0; }
.hdr-name .eyebrow { display: block; font: 500 11px/1.2 var(--font-body); color: var(--fg-3); }
.hdr-name strong { display: block; font: 700 22px/1.05 var(--font-display); letter-spacing: .01em; }
.hdr-state { grid-area: state; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.state { display: flex; flex-direction: column; gap: 4px; min-width: 0; border-radius: 8px; }
.state-k { display: flex; align-items: center; gap: 5px; font: 500 11px/1 var(--font-body); color: var(--fg-3); }
.state-k .ic { width: 12px; height: 12px; }
.hdr-act { grid-area: act; display: flex; gap: 2px; }
.ibtn { min-width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9px; color: var(--fg-2); }
.ibtn:hover { background: var(--bg-hover); color: var(--fg); }
.ibtn .lbl, .ibtn .kbd { display: none; }
.kbd { font: 500 11px/1 var(--font-mono); padding: 3px 5px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--fg-3); }
.hdr-prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; pointer-events: none; }
.hdr-prog i { display: block; height: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); }
/* phone: two slim rows; the open-sources rule moves into the eyebrow, chips carry their own meaning */
.lng { display: none; } .sht { display: inline; }
.osbar, .state-k { display: none; }
.hdr-in { padding-block: 8px 10px; gap: 6px 12px; }
.hdr-state { grid-template-columns: auto minmax(0, 1fr); }
.explain { position: absolute; left: var(--gutter); right: var(--gutter); top: calc(100% + 8px); max-width: 560px; z-index: 2; padding: 12px 14px; border-radius: 12px; background: var(--bg-raised); box-shadow: var(--shadow), 0 0 0 1px var(--line-strong); font-size: 14px; color: var(--fg-2); animation: up .16s ease-out; }
.explain b { color: var(--fg); font-weight: 600; }

/* ---------- chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 3px 9px; border-radius: 7px; font: 500 13px/1.2 var(--font-body); box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--fg-2); }
.chip .ic { width: 14px; height: 14px; }
.chip.sm { min-height: 22px; padding: 2px 8px; font-size: 12px; }
.st-fresh, .st-valid { color: var(--good); background: var(--good-wash); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--good) 40%, transparent); }
.st-aging, .st-draft { color: var(--warn); background: var(--warn-wash); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 40%, transparent); }
.st-stale, .st-flag { color: var(--bad); background: var(--bad-wash); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bad) 40%, transparent); }
.st-up { color: var(--accent); background: var(--accent-wash); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
.st-auto { color: var(--fg-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
.conf { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 7px; border-radius: 4px; font: 600 11px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; flex: none; }
.conf svg { width: 7px; height: 7px; }
.conf-assessed { background: var(--solid-bg); color: var(--solid-fg); }
.conf-claimed { box-shadow: inset 0 0 0 1.5px var(--fg-3); color: var(--fg-2); }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; flex: none; }
.bars i { width: 3px; background: var(--line-strong); border-radius: 1px; }
.bars i:nth-child(1) { height: 4px; } .bars i:nth-child(2) { height: 6.5px; } .bars i:nth-child(3) { height: 9px; } .bars i:nth-child(4) { height: 12px; }
.b1 i:nth-child(-n+1), .b2 i:nth-child(-n+2), .b3 i:nth-child(-n+3), .b4 i:nth-child(-n+4) { background: var(--fg-2); }
.bars.flagged i:nth-child(1) { background: var(--bad); }
.src-sum { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--fg-3); }
.src-sum b { color: var(--fg-2); font-weight: 500; }

/* ---------- page frame ---------- */
.app { padding-top: var(--hdr-full); }
.rail, .aside { display: none; }
.main { padding: 4px var(--gutter) calc(var(--tab-h) + 48px + env(safe-area-inset-bottom, 0px)); min-width: 0; }
.main:focus { outline: none; }
.stage { max-width: 860px; margin: 0 auto; }
@keyframes fadeIn { from { opacity: .25; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.enter { animation: fadeIn .22s cubic-bezier(.2, .8, .2, 1); }
@keyframes flash { 0%, 35% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
.flash { animation: flash 1.8s ease-out; border-radius: 12px; }
.stage-head { padding: 18px 0 6px; }
.stepper { display: flex; list-style: none; margin: 0 0 18px; padding: 0; }
.stepper li { flex: 1 1 0; min-width: 0; position: relative; }
.stepper li + li::before { content: ""; position: absolute; top: 13px; left: -50%; right: 50%; height: 2px; background: var(--line-strong); }
.stepper button { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px; font: 500 12.5px/1.2 var(--font-body); color: var(--fg-3); }
.stepper .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 13px/1 var(--font-mono); background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--line-strong); color: var(--fg-2); }
.stepper [aria-current="step"] { color: var(--fg); font-weight: 600; }
.stepper [aria-current="step"] .n { background: var(--accent); color: var(--bg); box-shadow: none; }
.stage-title { font: 700 36px/1.05 var(--font-display); margin: 0 0 6px; text-wrap: balance; }
.stage-title small { display: block; font: 500 13px/1.3 var(--font-body); color: var(--fg-3); margin-bottom: 6px; }
.stage-sub { color: var(--fg-2); margin: 0 0 14px; max-width: 62ch; }
.stage-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.stage-meta .meta { font: 500 12px/1 var(--font-mono); color: var(--fg-3); }
.switch { display: inline-flex; align-items: center; gap: 9px; min-height: 34px; font-size: 14px; color: var(--fg-2); margin-left: auto; }
.switch .sw { width: 34px; height: 20px; border-radius: 10px; background: var(--line-strong); position: relative; transition: background .18s; flex: none; }
.switch .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); transition: transform .18s; }
.switch[aria-pressed="true"] .sw { background: var(--accent); }
.switch[aria-pressed="true"] .sw::after { transform: translateX(14px); background: var(--bg); }
.subnav { position: sticky; top: var(--hdr-h); z-index: 20; margin: 14px calc(-1 * var(--gutter)) 0; padding: 8px var(--gutter); background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.subnav::-webkit-scrollbar { display: none; }
.sn { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 17px; font-size: 14px; color: var(--fg-2); text-decoration: none; white-space: nowrap; }
.sn .k { font: 500 11px/1 var(--font-mono); color: var(--fg-3); }
.sn[aria-current="true"] { background: var(--fg); color: var(--bg); }
.sn[aria-current="true"] .k { color: var(--bg); opacity: .7; }
.part { scroll-margin-top: calc(var(--hdr-cmp) + 62px); padding-top: 36px; }
.part + .part { margin-top: 28px; border-top: 1px solid var(--line); }
.part-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 4px; font: 700 27px/1.15 var(--font-display); text-wrap: balance; }
.part-h .k { font: 500 13px/1 var(--font-mono); color: var(--fg-3); }
.part-sub { color: var(--fg-2); margin: 0 0 20px; max-width: 64ch; }
.blocks { display: flex; flex-direction: column; gap: 30px; }
.blk-h { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font: 600 15px/1.2 var(--font-body); color: var(--fg); }
.blk-h .n { font: 500 12px/1 var(--font-mono); color: var(--fg-3); }
.blk-h .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.blk-note { font-size: 13.5px; color: var(--fg-3); margin: 10px 0 0; display: flex; gap: 8px; align-items: flex-start; }
.blk-note .ic { width: 15px; height: 15px; margin-top: 3px; }
.blk-note.warn .ic { color: var(--warn); }
.gap { margin-top: 22px; padding: 12px 14px; border-radius: 12px; background: var(--warn-wash); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 30%, transparent); font-size: 13.5px; color: var(--fg-2); display: flex; gap: 10px; }
.gap .ic { width: 16px; height: 16px; margin-top: 3px; color: var(--warn); }
.gap b { color: var(--fg); font-weight: 600; }
.golink { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--accent); text-decoration: none; min-height: 36px; }
.golink:hover { text-decoration: underline; }
.golink .ic { width: 16px; height: 16px; }
.stage-foot { display: flex; gap: 10px; margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); }
.nextbtn { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line-strong); text-decoration: none; min-height: 64px; }
.nextbtn:hover { background: var(--bg-hover); }
.nextbtn small { font-size: 12.5px; color: var(--fg-3); }
.nextbtn span { display: flex; align-items: center; gap: 8px; font: 700 19px/1.1 var(--font-display); }
.nextbtn.next { text-align: right; } .nextbtn.next span { justify-content: flex-end; }
.nextbtn.prev { flex: 0 0 auto; }

/* ---------- claims ---------- */
.claim { position: relative; border-radius: 12px; transition: background .15s, box-shadow .15s; cursor: pointer; }
.claim--card { background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); padding: 16px 18px 12px; }
.claim--row { padding: 14px 12px 10px; margin-inline: -12px; }
.list > .claim--row + .claim--row { box-shadow: 0 -1px 0 var(--line); border-top-left-radius: 0; border-top-right-radius: 0; }
.claim--hero { padding: 0; }
.claim.is-active { background: var(--accent-wash); }
.claim--card.is-active { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }
.claim-label { font: 500 12.5px/1.2 var(--font-body); color: var(--fg-3); margin-bottom: 6px; }
.claim-title { font: 600 17px/1.3 var(--font-body); margin: 0 0 4px; }
.claim-text { margin: 0; text-wrap: pretty; }
.claim-text.lead { font: 500 21px/1.48 var(--font-body); letter-spacing: -.005em; }
.claim-text.stat { font: 700 26px/1.15 var(--font-display); }
.num { font-family: var(--font-display); font-weight: 700; font-size: 1.1em; color: var(--fg); }
.claim-text.stat .num { font-size: 1em; }
.claim-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 10px; width: 100%; min-height: 32px; border-radius: 6px; }
.claim-chev { margin-left: auto; color: var(--fg-3); display: inline-flex; transition: transform .2s; }
.is-open > .claim-meta .claim-chev { transform: rotate(180deg); }
.asof { font: 500 11px/1 var(--font-mono); color: var(--fg-3); }
.claim-src { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s cubic-bezier(.2, .8, .2, 1); cursor: default; }
.is-open > .claim-src { grid-template-rows: 1fr; }
.claim-src-in { overflow: hidden; min-height: 0; }
.srclist { list-style: none; margin: 8px 0 6px; padding: 12px 14px; background: var(--bg-sunk); border-radius: 10px; display: flex; flex-direction: column; gap: 12px; }
.src-i { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.src-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--fg-3); }
.src-tier { font-weight: 600; color: var(--fg-2); }
.src-date { font-family: var(--font-mono); font-size: 11.5px; }
.src-title { font-size: 14.5px; font-weight: 500; color: var(--fg); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; overflow-wrap: anywhere; }
.src-title:hover { text-decoration-color: var(--accent); }
.src-title .ic { width: 13px; height: 13px; margin-left: 5px; vertical-align: -1px; color: var(--fg-3); }
.src-warn { font-size: 12.5px; color: var(--bad); display: flex; align-items: center; gap: 6px; }
.src-warn .ic { width: 13px; height: 13px; }
.src-cited { font-size: 12px; color: var(--fg-3); }
.src-cited.none { color: var(--warn); }
.src-missing { color: var(--bad); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.assess { padding: 16px 18px; border-radius: 12px; background: var(--bg-sunk); box-shadow: inset 0 0 0 1px var(--line); }
.assess-k { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 8px; }
.assess-k .t { font: 600 15px/1.2 var(--font-body); }
.assess-k .why { font-size: 12.5px; color: var(--fg-3); }
.assess p { margin: 0; }
.assess p.big { font: 500 18px/1.5 var(--font-body); }

/* ---------- photos ---------- */
.ph { position: relative; background: var(--bg-sunk); overflow: hidden; margin: 0; }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ph .cr { position: absolute; right: 6px; bottom: 6px; max-width: calc(100% - 12px); font: 500 10.5px/1.3 var(--font-body); color: #fff; background: rgba(0, 0, 0, .55); padding: 2px 7px; border-radius: 999px; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph.broken img { display: none; }

.ph .fb { display: none; position: absolute; inset: 0; }
.ph.broken .fb { display: grid; }
.ph .fb .mono { width: 100%; height: 100%; }
.faces { display: grid; grid-auto-flow: column; grid-auto-columns: 112px; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; margin-inline: calc(-1 * var(--gutter)); padding: 2px var(--gutter) 8px; scrollbar-width: none; }
.faces::-webkit-scrollbar { display: none; }
.face { scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px 10px; border-radius: 12px; text-align: center; min-width: 0; }
.face:hover { background: var(--bg-hover); }
.av { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; flex: none; display: grid; place-items: center; background: linear-gradient(160deg, var(--bg-raised-2), var(--bg-sunk)); box-shadow: 0 0 0 1px var(--line-strong); margin-bottom: 4px; }
.av.ph img { object-position: 50% 22%; }
.av .fb { place-items: center; }
.av-i { font: 700 24px/1 var(--font-display); letter-spacing: .03em; color: var(--fg-3); }
.fn { font-size: 13.5px; font-weight: 600; line-height: 1.25; }
.fr { font-size: 12px; color: var(--fg-3); line-height: 1.3; }
.mono { position: relative; }
.mono-n { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 5px; font: 500 11.5px/1.3 var(--font-body); letter-spacing: 0; color: var(--fg-3); }
.mono-n .ic { width: 13px; height: 13px; }
.lc .mono-pending { aspect-ratio: 4 / 3; }
.lc-role { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: none; }
.lc .ph img { object-position: 50% 20%; }
@media (min-width: 1024px) { .faces { grid-auto-flow: row; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-columns: auto; overflow: visible; margin-inline: 0; padding-inline: 0; } }

/* ---------- hero ---------- */
.hero { position: relative; margin: 0 calc(-1 * var(--gutter)); overflow: hidden; background: var(--bg-sunk); }
.hero .ph { aspect-ratio: 16 / 10; max-height: 52vh; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6, 10, 14, 0) 30%, rgba(6, 10, 14, .85) 100%); pointer-events: none; }
.hero-over { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 16px; z-index: 1; color: #fff; }
.hero-over span { font: 500 13px/1.2 var(--font-body); opacity: .85; }
.hero-over h1 { font: 700 46px/1 var(--font-display); margin: 4px 0 0; }
.hero .cr { top: 10px; bottom: auto; z-index: 2; }
.hero-map { position: relative; padding: 2px 0 6px; display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 12px; align-items: end; }
.hero-map h1 { font: 700 50px/1 var(--font-display); margin: 4px 0 0; }
.hero-map span { font-size: 13.5px; color: var(--fg-3); }
.hero-map svg { width: 112px; height: auto; display: block; }
/* Insignia: national flag and the forces' flag/emblems, each credited to its source file. Three across; text beside the image from 640px. */
.insig { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 8px; margin: 14px 0 20px; padding: 0; list-style: none; }
.insig li { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; padding: 10px 6px 9px; text-align: center; border-radius: 12px; background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); }
.insig .im { flex: none; width: 54px; height: 36px; display: grid; place-items: center; }
.insig .im img { max-width: 54px; max-height: 36px; width: auto; height: auto; display: block; }
.insig .im img.flag { width: 54px; max-height: none; }
.insig .im img.fl { box-shadow: 0 0 0 1px var(--line-strong); border-radius: 2px; }
.insig .tx { min-width: 0; }
.insig b { display: block; font: 600 12.5px/1.2 var(--font-body); color: var(--fg); }
.insig small { display: block; font-size: 11.5px; line-height: 1.3; color: var(--fg-3); margin-top: 2px; }
.insig small a { color: inherit; }
.insig .loc { display: none; }
@media (min-width: 640px) {
  .insig li { flex-direction: row; text-align: left; gap: 11px; padding: 9px 12px 9px 9px; }
  .insig b { font-size: 13.5px; } .insig small { font-size: 12px; } .insig .loc { display: inline; }
}
.sym-badge { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 13px; color: var(--fg-3); }
.sym-badge img { height: 40px; width: auto; max-width: 56px; object-fit: contain; }
.sym-badge b { display: block; color: var(--fg); font: 600 14px/1.2 var(--font-body); }
.sym-badge a { color: inherit; }

/* ---------- the 3-minute layer ---------- */
.quick { display: grid; gap: 10px; padding: 14px 16px; border-radius: var(--radius); background: var(--accent-wash); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); margin: 0 0 14px; }
.quick-h { display: flex; align-items: center; gap: 8px; font: 700 19px/1.2 var(--font-display); }
.quick-h .ic { color: var(--accent); }
.quick-h span { margin-left: auto; font: 500 12.5px/1.2 var(--font-body); color: var(--fg-2); }
.quick ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.quick a { display: flex; flex-direction: column; gap: 3px; height: 100%; padding: 9px 11px; border-radius: 10px; background: var(--bg-raised); text-decoration: none; font-size: 14px; font-weight: 600; line-height: 1.25; min-height: 56px; }
.quick a:hover { background: var(--bg-raised-2); }
.quick a small { font: 500 11px/1 var(--font-mono); color: var(--fg-3); }
.sn .q { width: 13px; height: 13px; color: var(--accent); }
.sn[aria-current="true"] .q { color: var(--bg); }
.now { display: grid; gap: 10px; }
.tp-head { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.tp-ctx { margin: 0; color: var(--fg-2); font-size: 14.5px; max-width: 62ch; flex: 1 1 280px; }
.tp-ctx .conf { margin-right: 6px; vertical-align: 1px; }
.tpg { display: grid; gap: 12px; }
.tp-group { padding: 14px 18px 6px; border-radius: var(--radius); background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); min-width: 0; }
.tp-group h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font: 700 19px/1.2 var(--font-display); }
.tp-group h3 .ic { width: 19px; height: 19px; }
.tp-open h3 .ic { color: var(--good); } .tp-ask h3 .ic { color: var(--accent); } .tp-offer h3 .ic { color: var(--c6); } .tp-avoid h3 .ic { color: var(--bad); }
.tp-group ol { margin: 0; padding: 0; list-style: none; }
.tp { padding: 11px 0; box-shadow: 0 -1px 0 var(--line); }
.tp:first-child { box-shadow: none; }
.tp-t { margin: 0; font-size: 16px; line-height: 1.5; font-weight: 500; }
.tp-w { margin: 3px 0 0; font-size: 13.5px; color: var(--fg-3); }
.tp-src summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 7px; min-height: 30px; font-size: 12.5px; color: var(--fg-3); }
.tp-src summary::-webkit-details-marker { display: none; }
.tp-src summary .ic { width: 14px; height: 14px; transition: transform .2s; }
.tp-src[open] summary .ic { transform: rotate(180deg); }
.end3 { margin-top: 18px; padding: 12px 16px; border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line-strong); display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; font-size: 14.5px; }
.end3 > .ic { color: var(--good); }
.end3 b { font-weight: 600; }

/* ---------- brief ---------- */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 4px; padding: 14px 14px 10px; background: var(--bg-raised); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); text-decoration: none; min-height: 128px; min-width: 0; }
.stat:hover { background: var(--bg-raised-2); }
.stat-k { font-size: 13px; color: var(--fg-2); }
.stat-v { font: 700 31px/1.05 var(--font-display); }
.stat-s { font-size: 12px; color: var(--fg-3); }
.spark { display: block; width: 100%; height: 26px; margin-top: auto; }
.q { font: 500 20px/1.5 var(--font-body); margin: 0; max-width: 60ch; }
.wd { display: grid; gap: 12px; margin-top: 16px; }
.wd-col { padding: 16px 18px; border-radius: 12px; background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); }
.wd-col h3 { display: flex; gap: 8px; align-items: center; margin: 0; font: 700 19px/1.2 var(--font-display); }
.wd-col ul { margin: 10px 0 0; padding: 0; list-style: none; }
.wd-col li { padding: 9px 0; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; box-shadow: 0 -1px 0 var(--line); }
.wd-col li .ic { width: 16px; height: 16px; margin-top: 4px; }
.wd-col.want .ic { color: var(--good); } .wd-col.dont .ic { color: var(--bad); }
.kf { display: grid; gap: 10px; }
.cov { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.cov > div { background: var(--bg-raised); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.cov b { font: 700 27px/1 var(--font-display); }
.cov b.warn { color: var(--warn); font-size: 22px; line-height: 27px; }
.cov span { font-size: 13px; color: var(--fg-2); line-height: 1.3; }
.integrity { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13.5px; color: var(--fg-2); }
.integrity .ic { width: 16px; height: 16px; color: var(--good); }
.integrity.bad .ic { color: var(--bad); }
.sig { display: grid; gap: 8px; padding: 14px 16px; border-radius: 12px; background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); }
.sig-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sig-date { font: 500 12px/1 var(--font-mono); color: var(--fg-2); }
.sig h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4; }
.sig h3 a { text-decoration: none; } .sig h3 a:hover { text-decoration: underline; }
.sig p { margin: 0; color: var(--fg-2); font-size: 14.5px; }
.legend { display: grid; gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.legend > div { display: grid; gap: 8px; padding: 12px 14px; background: var(--bg-raised); }
.legend dt { font-size: 13px; font-weight: 600; color: var(--fg-2); }
.legend dd { margin: 0; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--fg-2); }
.legend dd span { display: inline-flex; align-items: center; gap: 7px; }

/* ---------- force: map + orbat ---------- */
.two { display: grid; gap: 10px; }
.ob { display: grid; gap: 12px; }
.ob-map { background: var(--bg-raised); border-radius: var(--radius); box-shadow: 0 0 0 1px var(--line); padding: 10px; }
.ob-map svg { display: block; width: 100%; height: auto; max-width: 520px; margin: 0 auto; }
.map-n { fill: var(--map-land); stroke: var(--map-edge); stroke-width: 1; }
.map-f { fill: var(--map-focus); stroke: var(--fg-3); stroke-width: 1.6; }
.map-lbl { font: 500 17px var(--font-body); fill: var(--fg-3); }
.map-city { font: 600 16px var(--font-body); fill: var(--fg); paint-order: stroke; stroke: var(--map-focus); stroke-width: 4px; stroke-linejoin: round; }
.map-dot { cursor: pointer; }
.map-dot circle.d { fill: var(--accent); stroke: var(--map-focus); stroke-width: 3; }
.map-dot.brig circle.d { fill: var(--map-focus); stroke: var(--accent); stroke-width: 3.5; }
.map-dot rect.d { fill: var(--fg); stroke: var(--map-focus); stroke-width: 3; }
.map-dot .halo { fill: var(--accent); opacity: 0; transition: opacity .2s; }
.map-dot.sel .halo { opacity: .22; }
.map-dot:focus-visible { outline: none; } .map-dot:focus-visible .halo { opacity: .35; }
.map-cap { fill: var(--fg); }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; font-size: 12.5px; color: var(--fg-2); padding: 6px 0 2px; }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-div { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); }
.lg-brig { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 2.5px var(--accent); }
.lg-cap { width: 9px; height: 9px; background: var(--fg); }
.lg-cmd { width: 9px; height: 9px; background: var(--fg); transform: rotate(45deg); }
.map-note { margin: 4px 0 0; font-size: 11.5px; line-height: 1.4; color: var(--fg-3); text-align: center; }
.orbat { border-radius: var(--radius); background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.orbat-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; box-shadow: 0 1px 0 var(--line); align-items: center; }
.orbat-tools .end { margin-left: auto; display: flex; gap: 2px; }
.tbtn { height: 34px; padding: 0 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }
.tbtn:hover { background: var(--bg-hover); color: var(--fg); }
.tbtn .ic { width: 15px; height: 15px; }
.og-h { display: flex; justify-content: space-between; padding: 8px 14px; font-size: 12.5px; font-weight: 600; color: var(--fg-3); background: var(--bg-sunk); }
.og-h .n { font-family: var(--font-mono); font-weight: 500; }
.unit { box-shadow: 0 -1px 0 var(--line); }
.unit.sel > .unit-row { background: var(--accent-wash); }
.unit-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 10px 14px; min-height: 58px; }
.unit-row:hover { background: var(--bg-hover); }
.sym { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--fg-2); }
.ech { font: 700 9px/1 var(--font-mono); letter-spacing: .12em; height: 9px; }
.frame { width: 28px; height: 18px; border: 1.5px solid currentColor; border-radius: 1px; }
.unit-name { display: block; font-weight: 600; line-height: 1.3; }
.unit-hq { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--fg-2); margin-top: 2px; }
.unit-hq .ic { width: 13px; height: 13px; color: var(--fg-3); }
.unit-aside { display: flex; align-items: center; gap: 10px; color: var(--fg-3); }
.tag { font: 600 11px/1.2 var(--font-body); padding: 3px 6px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--fg-2); }
.unit-row[aria-expanded="true"] .claim-chev { transform: rotate(180deg); }
.unit-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s cubic-bezier(.2, .8, .2, 1); }
.unit-body.open { grid-template-rows: 1fr; }
.unit-body-in { overflow: hidden; min-height: 0; }
.unit-detail { padding: 0 14px 14px 60px; display: flex; flex-direction: column; gap: 10px; }
.unit-dl { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 0; font-size: 13.5px; }
.unit-dl div { display: flex; gap: 6px; } .unit-dl dt { color: var(--fg-3); } .unit-dl dd { margin: 0; font-weight: 500; }
.gap-note { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--fg-3); margin: 0; font-style: italic; }
.gap-note .ic { width: 15px; height: 15px; }
.unit-children { box-shadow: inset 1px 0 0 var(--line-strong); margin-left: 4px; }
.btiles { display: grid; gap: 10px; }

/* ---------- filters ---------- */
.fbar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--gutter)); padding: 2px var(--gutter); }
.fbar::-webkit-scrollbar { display: none; }
.fchip { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line-strong); font-size: 14px; color: var(--fg-2); white-space: nowrap; }
.fchip:hover { color: var(--fg); }
.fchip[aria-pressed="true"] { background: var(--fg); color: var(--bg); box-shadow: none; }
.fchip .c { font: 500 11.5px/1 var(--font-mono); opacity: .7; }
.fchip .ic { width: 15px; height: 15px; }
.seg { display: inline-flex; box-shadow: inset 0 0 0 1px var(--line-strong); border-radius: 9px; padding: 2px; flex: none; }
.seg button { height: 32px; padding: 0 11px; border-radius: 7px; font-size: 13px; color: var(--fg-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg .ic { width: 15px; height: 15px; }

/* ---------- cards ---------- */
.cards { display: grid; gap: 12px; }
.pcard { display: flex; flex-direction: column; border-radius: var(--radius); overflow: hidden; background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); min-width: 0; }
.pcard .ph { aspect-ratio: 16 / 9; }
.pcard .claim--card { box-shadow: none; border-radius: 0; flex: 1; }
.lcards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.lc { display: flex; flex-direction: column; border-radius: var(--radius); overflow: hidden; background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); text-align: left; min-width: 0; transition: transform .15s, box-shadow .15s; }
.lc:hover { box-shadow: 0 0 0 1px var(--line-strong); transform: translateY(-1px); }
.lc .ph, .lc .mono { aspect-ratio: 4 / 5; }
.mono { display: grid; place-items: center; background: linear-gradient(160deg, var(--bg-raised-2), var(--bg-sunk)); color: var(--fg-3); font: 700 44px/1 var(--font-display); letter-spacing: .04em; }
.lc-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 3px; }
.lc-name { font: 700 18px/1.2 var(--font-display); }
.lc-appt { font-size: 13.5px; color: var(--fg-2); line-height: 1.35; }
.lc-since { font: 500 11.5px/1.3 var(--font-mono); color: var(--fg-3); margin-top: 4px; }
.lc .tag { align-self: flex-start; margin-top: 6px; }
.mrail { display: grid; grid-auto-flow: column; grid-auto-columns: min(286px, 84%); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: var(--gutter); margin-inline: calc(-1 * var(--gutter)); padding: 4px var(--gutter) 14px; overscroll-behavior-x: contain; scrollbar-width: thin; }
.mrail > * { scroll-snap-align: start; }
.mcard { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: var(--radius); background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); min-height: 220px; min-width: 0; }
.mcard-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
.mtype { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--fg-2); }
.mtype .ic { width: 15px; height: 15px; }
.mcard-title { font: 600 16px/1.35 var(--font-body); margin: 0; overflow-wrap: anywhere; }
.mcard-sub { font-size: 13.5px; color: var(--fg-2); }
.mcard-date { font: 500 11.5px/1 var(--font-mono); color: var(--fg-3); }
.mcard-note { font-size: 13.5px; color: var(--fg-2); margin: 0; }
.mcard-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 10px; box-shadow: 0 -1px 0 var(--line); }
.mlink { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; font-size: 14px; color: var(--accent); text-decoration: none; min-height: 36px; padding-inline: 4px; }
.mlink:hover { text-decoration: underline; }
.mlink .ic { width: 15px; height: 15px; }
.empty { padding: 22px 16px; text-align: center; color: var(--fg-3); box-shadow: inset 0 0 0 1px var(--line-strong); border-radius: var(--radius); font-size: 14px; }

/* ---------- ties graphic ---------- */
.ties { display: grid; gap: 14px; }
.ties-g { background: var(--bg-raised); border-radius: var(--radius); box-shadow: 0 0 0 1px var(--line); padding: 8px; }
.ties-g svg { display: block; width: 100%; max-width: 460px; height: auto; margin: 0 auto; }
.t-ring { fill: none; stroke: var(--line-strong); stroke-width: 1; }
.t-ringlbl { font: 500 10.5px var(--font-body); fill: var(--fg-3); }
.t-edge { stroke: var(--fg-3); opacity: .55; }
.t-node { cursor: pointer; }
.t-node circle { fill: var(--bg-raised); stroke-width: 3; transition: fill .15s; }
.t-node text { font: 600 10px var(--font-mono); fill: var(--fg); }
.t-node.sel circle { fill: var(--accent-wash); stroke-width: 4.5; }
.t-node:focus-visible { outline: none; } .t-node:focus-visible circle { stroke-width: 5; }
.t-hub circle { fill: var(--fg); } .t-hub text { fill: var(--bg); font: 700 12px var(--font-mono); }
.t-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 12.5px; color: var(--fg-2); padding: 4px 6px 8px; }
.t-legend span { display: inline-flex; align-items: center; gap: 6px; }
.t-legend i { width: 11px; height: 11px; border-radius: 50%; }
.tdet { padding: 16px 18px; border-radius: var(--radius); background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tdet h3 { margin: 0; font: 700 24px/1.1 var(--font-display); display: flex; align-items: center; gap: 10px; }
.tdet .types { display: flex; flex-wrap: wrap; gap: 6px; }
.tdet .types .chip i { width: 9px; height: 9px; border-radius: 50%; }
.agr { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.agr li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; }
.agr .y { font: 500 12.5px/1.6 var(--font-mono); color: var(--fg-3); }
.plist { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- scholars ---------- */
.scard { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--radius); background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); min-width: 0; }
.scard h3 { margin: 0; font: 700 18px/1.2 var(--font-display); }
.scard .aff { font-size: 13.5px; color: var(--fg-2); line-height: 1.35; }
.scard p { margin: 0; font-size: 14px; }
.scard .focus { display: flex; flex-wrap: wrap; gap: 5px; }
.scard ul { list-style: none; margin: auto 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.scard ul .src-title { font-size: 13.5px; }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; box-shadow: 0 -1px 0 var(--line); align-items: start; }
.row:first-child { box-shadow: none; }
.row h4 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; }
.row h4 a { text-decoration: none; } .row h4 a:hover { text-decoration: underline; }
.row p { margin: 2px 0 0; font-size: 13.5px; color: var(--fg-2); grid-column: 1 / -1; }
.row .r { font-size: 12.5px; color: var(--fg-3); text-align: right; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }

/* ---------- charts ---------- */
.chart { display: grid; grid-template-columns: 40px minmax(0, 1fr); grid-template-rows: auto 200px auto; column-gap: 8px; padding: 14px 16px 12px; background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); border-radius: var(--radius); }
.chart-cap { grid-column: 1 / -1; grid-row: 1; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; color: var(--fg-2); margin-bottom: 4px; }
.chart-cap b { color: var(--fg); font-weight: 600; }
.chart-y, .chart-plot { position: relative; margin-top: 28px; grid-row: 2; }
.chart-y { grid-column: 1; } .chart-plot { grid-column: 2; }
.chart-y span { position: absolute; right: 0; transform: translateY(50%); font: 500 11px/1 var(--font-mono); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.gl { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
.gl.base { background: var(--line-strong); }
.refl { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--warn); z-index: 1; pointer-events: none; }
.refl span { position: absolute; right: 0; bottom: 4px; font-size: 12px; font-weight: 600; color: var(--warn); background: var(--bg-raised); padding: 0 4px; border-radius: 3px; }
.cols { position: absolute; inset: 0; display: flex; }
.col { flex: 1 1 0; display: flex; justify-content: center; align-items: flex-end; height: 100%; position: relative; border-radius: 6px 6px 0 0; min-width: 0; }
.col:hover { background: var(--bg-hover); }
.bar { width: min(24px, 64%); background: var(--bar); border-radius: 4px 4px 0 0; position: relative; transition: background .15s; }
.bar.est { background: repeating-linear-gradient(135deg, var(--bar) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1.5px var(--bar); }
.col.sel .bar { background: var(--accent); box-shadow: none; }
.col.sel .bar.est { background: repeating-linear-gradient(135deg, var(--accent) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1.5px var(--accent); }
.val { position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -6px); font: 700 14px/1 var(--font-display); color: var(--fg); white-space: nowrap; display: none; }
.col.sel .val, .col.last .val { display: block; }
.chart-x { grid-column: 2; grid-row: 3; display: flex; }
.chart-x span { flex: 1 1 0; min-width: 0; text-align: center; font: 500 11px/1 var(--font-mono); color: var(--fg-3); padding-top: 9px; overflow: hidden; }
.chart-x span.sel { color: var(--fg); font-weight: 600; }
.chart-x.dense span:nth-child(even):not(.sel) { visibility: hidden; }
.chart-key { grid-column: 1 / -1; grid-row: 4; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-3); padding-top: 10px; }
.chart-key span { display: inline-flex; align-items: center; gap: 6px; }
.chart-key i { width: 12px; height: 12px; border-radius: 2px; background: var(--bar); }
.chart-key i.est { background: repeating-linear-gradient(135deg, var(--bar) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1.5px var(--bar); }
.ydet { margin-top: 10px; padding: 14px 16px; border-radius: 12px; background: var(--bg-sunk); display: flex; flex-direction: column; gap: 8px; }
.ydet-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.ydet-h b { font: 700 26px/1 var(--font-display); }
.ydet-h span { font: 500 12px/1 var(--font-mono); color: var(--fg-2); }
.ydet p { margin: 0; font-size: 14px; color: var(--fg-2); }
.hbars { display: flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); border-radius: var(--radius); }
.hb { display: grid; grid-template-columns: 112px minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 14px; }
.hb .t { height: 14px; background: var(--bg-sunk); border-radius: 3px; overflow: hidden; }
.hb .t i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.hb .v { font: 600 14px/1 var(--font-display); text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- timelines ---------- */
.tl { list-style: none; margin: 0; padding: 0; }
.tl > li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 0 12px; }
.tl-year { font: 700 17px/1 var(--font-display); padding-top: 18px; text-align: right; font-variant-numeric: tabular-nums; }
.tl-items { box-shadow: inset 2px 0 0 var(--line-strong); padding: 6px 0 8px 14px; display: flex; flex-direction: column; gap: 2px; position: relative; min-width: 0; }
.tl-items > .claim { margin-inline: 0 -12px; padding-left: 12px; }
.tl-items > .claim::before { content: ""; position: absolute; left: -19px; top: 20px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 2.5px var(--accent); }

/* ---------- engagement ---------- */
.lad { background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); border-radius: var(--radius); padding: 14px 16px 6px; }
.lad-scale { position: relative; height: 40px; margin: 0 16px; }
.lad-scale span { position: absolute; top: 0; transform: translateX(-50%); width: 52px; text-align: center; font-size: 11px; line-height: 1.25; color: var(--fg-3); }
.lad-scale b { display: block; font: 600 11px/1.2 var(--font-mono); color: var(--fg-2); }
.lad-row { padding: 12px 0 14px; box-shadow: 0 -1px 0 var(--line); }
.lad-name { display: flex; justify-content: space-between; gap: 8px; font-size: 14.5px; font-weight: 600; margin-bottom: 10px; line-height: 1.35; }
.lad-name span { font-weight: 400; font-size: 12.5px; color: var(--fg-3); white-space: nowrap; }
.lad-track { position: relative; height: 16px; margin: 0 16px; }
.lad-track::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: var(--line-strong); border-radius: 1px; }
.lad-tick { position: absolute; top: 5px; width: 2px; height: 6px; background: var(--line-strong); transform: translateX(-1px); }
.lad-seg { position: absolute; top: 6px; height: 4px; background: var(--accent); border-radius: 2px; }
.lad-now, .lad-tgt { position: absolute; top: 1px; width: 14px; height: 14px; border-radius: 50%; transform: translateX(-50%); }
.lad-now { background: var(--fg); box-shadow: 0 0 0 3px var(--bg-raised); }
.lad-tgt { background: var(--bg-raised); box-shadow: inset 0 0 0 3px var(--accent), 0 0 0 3px var(--bg-raised); }
.lad-key { display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--fg-2); padding: 10px 0; box-shadow: 0 -1px 0 var(--line); }
.lad-key span { display: inline-flex; align-items: center; gap: 6px; }
.lad-key .k-now { width: 12px; height: 12px; border-radius: 50%; background: var(--fg); }
.lad-key .k-tgt { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--accent); }
.loe { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: var(--radius); background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); }
.loe-h { display: flex; align-items: flex-start; gap: 12px; }
.loe-n { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font: 700 14px/1 var(--font-mono); background: var(--accent-wash); color: var(--accent); }
.loe-h h3 { margin: 0; font: 700 21px/1.15 var(--font-display); }
.loe-h .hz { font-size: 12.5px; color: var(--fg-3); margin-top: 3px; display: block; }
.kv { display: grid; gap: 6px; }
.kv > span:first-child { font-size: 12.5px; font-weight: 600; color: var(--fg-3); }
.acts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.acts li { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; font-size: 14.5px; line-height: 1.45; }
.acts .tag { justify-self: start; }
.unitchips { display: flex; flex-wrap: wrap; gap: 6px; }
.unitchips a { text-decoration: none; }
.bul { margin: 0; padding-left: 18px; font-size: 14.5px; display: flex; flex-direction: column; gap: 4px; }
.mx-wrap { overflow-x: auto; background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); border-radius: var(--radius); }
table.mx { border-collapse: collapse; width: 100%; min-width: 330px; font-size: 14px; }
.mx th, .mx td { padding: 10px 3px; text-align: center; box-shadow: 0 1px 0 var(--line); }
.mx td:first-child { width: 42%; }
.mx th { font: 600 12px/1.2 var(--font-mono); color: var(--fg-3); }
.mx th:first-child, .mx td:first-child { text-align: left; padding-left: 14px; }
.mx td:first-child { font-weight: 500; line-height: 1.3; }
.mx td:first-child small { display: block; font-weight: 400; font-size: 12px; color: var(--fg-3); }
.mx .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
.mx tr.sel td { background: var(--accent-wash); }
.mx tbody tr { cursor: pointer; }
.mx tbody tr:hover td { background: var(--bg-hover); }
.mx-key { display: grid; gap: 4px; margin-top: 10px; font-size: 13px; color: var(--fg-2); }
.mx-key b { font-family: var(--font-mono); font-weight: 500; color: var(--fg-3); margin-right: 6px; }
.access-open { color: var(--good); } .access-nato { color: var(--warn); }
.trade { display: grid; gap: 10px; }
.tcol { padding: 16px 18px; border-radius: var(--radius); background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); }
.tcol-h { display: flex; align-items: center; gap: 10px; }
.tcol-h h3 { margin: 0; font: 700 20px/1 var(--font-display); }
.tcol-h .ic { color: var(--fg-3); }
.tcol-h .n { margin-left: auto; font: 500 12px/1 var(--font-mono); color: var(--fg-3); }
.tcol ul { list-style: none; padding: 0; margin: 10px 0 0; }
.tcol li { padding: 10px 0; box-shadow: 0 -1px 0 var(--line); line-height: 1.45; }
.tswap { display: flex; align-items: center; justify-content: center; color: var(--fg-3); height: 20px; }
.tswap .ic { transform: rotate(90deg); }
.lcard { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: var(--radius); background: var(--bg-raised); box-shadow: 0 0 0 1px var(--line); min-width: 0; }
.lcard-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.lcard-h h3 { margin: 0; font: 700 21px/1.12 var(--font-display); }
.lk { font-size: 12.5px; font-weight: 600; color: var(--fg-3); margin: 0 0 2px; }

/* ---------- drawer (leader profile) ---------- */
.drawer { position: fixed; z-index: 45; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top, 0px) + 28px); background: var(--bg); border-radius: 18px 18px 0 0; overflow: auto; overscroll-behavior: contain; animation: up .26s cubic-bezier(.2, .8, .2, 1); box-shadow: var(--shadow); }
.drawer-bar { position: sticky; top: 0; z-index: 3; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px 8px 18px; background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 1px 0 var(--line); }
.drawer-bar span { font-size: 13px; color: var(--fg-3); }
.pf { padding: 18px 20px calc(48px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 26px; }
.pf-top { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; align-items: end; }
.pf-top .ph, .pf-top .mono { aspect-ratio: 4 / 5; border-radius: 12px; font-size: 36px; }
.pf-top h2 { margin: 0; font: 700 27px/1.05 var(--font-display); }
.pf-top p { margin: 6px 0 0; color: var(--fg-2); line-height: 1.4; }
.pf-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font: 500 12px/1.3 var(--font-mono); color: var(--fg-3); }
.pf-sec h3 { margin: 0 0 10px; font: 700 19px/1.2 var(--font-display); display: flex; gap: 10px; align-items: baseline; }
.pf-sec h3 small { font: 400 12.5px/1.3 var(--font-body); color: var(--fg-3); }
.career { list-style: none; margin: 0; padding: 0; }
.career li { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; padding: 7px 0; }
.career .yr { font: 500 12.5px/1.5 var(--font-mono); color: var(--fg-2); text-align: right; }
.career .ro { box-shadow: inset 2px 0 0 var(--line-strong); padding-left: 16px; position: relative; line-height: 1.45; }
.career .ro::before { content: ""; position: absolute; left: -4px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 2.5px var(--fg-3); }
.career li:last-child .ro::before { box-shadow: none; background: var(--accent); }
.social { display: flex; flex-wrap: wrap; gap: 8px; }
.social a { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 4px 14px; border-radius: 19px; box-shadow: inset 0 0 0 1px var(--line-strong); text-decoration: none; font-size: 14px; }
.social a:hover { background: var(--bg-hover); }
.privacy { font-size: 12.5px; color: var(--fg-3); display: flex; gap: 8px; align-items: flex-start; margin: 0 0 8px; }
.privacy .ic { width: 14px; height: 14px; margin-top: 3px; }

/* ---------- tab bar (phone) ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; padding: 0 4px env(safe-area-inset-bottom, 0px); background: color-mix(in srgb, var(--bg-raised) 94%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 -1px 0 var(--line); }
.tab { flex: 1 1 0; min-width: 0; height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 500 11.5px/1 var(--font-body); color: var(--fg-3); text-decoration: none; position: relative; }
.tab .ic { width: 21px; height: 21px; }
.tab[aria-current="page"] { color: var(--fg); font-weight: 600; }
.tab[aria-current="page"] .ic { color: var(--accent); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 26%; right: 26%; height: 2px; border-radius: 0 0 2px 2px; background: var(--accent); }
.totop[hidden] { display: none; }
.totop { position: fixed; z-index: 25; right: 14px; bottom: calc(var(--tab-h) + 14px + env(safe-area-inset-bottom, 0px)); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-raised); color: var(--fg); box-shadow: var(--shadow), 0 0 0 1px var(--line-strong); animation: fadeIn .2s; }

/* ---------- overlays ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes up { from { transform: translateY(20px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes slideL { from { transform: translateX(28px); opacity: .4; } to { transform: none; opacity: 1; } }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.panel-h h2 { margin: 0; font: 700 22px/1 var(--font-display); }
.tg { margin-top: 18px; }
.tg-h { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--fg-2); }
.tg-h .n { margin-left: auto; font: 500 11.5px/1 var(--font-mono); color: var(--fg-3); }
.tg ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.tg .src-i { padding: 10px; border-radius: 10px; transition: background .2s, box-shadow .2s; }
.tg .src-i.hl { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent); background: var(--accent-wash); }
.aside-hint { font-size: 13px; color: var(--fg-3); margin: 0 0 4px; }
.aside-hint b { color: var(--fg-2); font-weight: 600; }
.palette { position: fixed; z-index: 41; left: 0; right: 0; margin-inline: auto; top: calc(env(safe-area-inset-top, 0px) + 10px); width: min(660px, calc(100% - 20px)); max-height: min(78vh, 640px); display: flex; flex-direction: column; background: var(--bg-raised); box-shadow: var(--shadow), 0 0 0 1px var(--line-strong); border-radius: 16px; overflow: hidden; animation: up .18s cubic-bezier(.2, .8, .2, 1); }
.cpick { position: fixed; z-index: 41; left: 0; right: 0; margin-inline: auto; top: calc(env(safe-area-inset-top, 0px) + 10px); width: min(440px, calc(100% - 20px)); max-height: min(78vh, 640px); overflow: auto; padding: 14px; background: var(--bg-raised); box-shadow: var(--shadow), 0 0 0 1px var(--line-strong); border-radius: 16px; animation: up .18s cubic-bezier(.2, .8, .2, 1); }
.cpick ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.cp-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px; min-height: 56px; border: 0; border-radius: 12px; background: var(--bg-raised-2); color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.cp-item:hover { background: var(--bg-hover); }
.cp-item[aria-current] { box-shadow: 0 0 0 1.5px var(--accent); }
.cp-item .flag { width: 40px; }
.cp-t { flex: 1; min-width: 0; }
.cp-t b { display: block; font: 700 17px/1.1 var(--font-display); }
.cp-t small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--fg-3); }
.cp-item > svg { width: 18px; height: 18px; color: var(--fg-3); flex: none; }
.cp-cur { font-size: 12px; font-weight: 600; color: var(--accent); flex: none; }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; box-shadow: 0 1px 0 var(--line); }
.pal-in .ic { color: var(--fg-3); }
.pal-in input { flex: 1; min-width: 0; height: 44px; font: 400 16px/1 var(--font-body); background: none; border: 0; color: var(--fg); outline: none; }
.pal-in input::placeholder { color: var(--fg-3); }
.pal-res { overflow: auto; padding: 6px; overscroll-behavior: contain; }
.pal-item { display: block; width: 100%; padding: 10px 12px; border-radius: 10px; }
.pal-item[aria-selected="true"] { background: var(--accent-wash); }
.pal-k { display: block; font-size: 12px; font-weight: 500; color: var(--fg-3); }
.pal-t { display: block; font-size: 14.5px; margin-top: 3px; color: var(--fg); line-height: 1.4; }
.pal-t mark { background: var(--accent-wash); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); border-radius: 2px; padding: 0 1px; }
.pal-empty { padding: 18px 14px; color: var(--fg-3); font-size: 14px; }
.pal-foot { display: flex; gap: 14px; padding: 8px 14px; box-shadow: 0 -1px 0 var(--line); font-size: 12px; color: var(--fg-3); }
.proto { position: fixed; z-index: 41; right: 10px; left: 10px; bottom: calc(var(--tab-h) + 10px + env(safe-area-inset-bottom, 0px)); max-height: 78vh; overflow: auto; padding: 16px; border-radius: 16px; background: var(--bg-raised); box-shadow: var(--shadow), 0 0 0 1px var(--line-strong); animation: up .2s cubic-bezier(.2, .8, .2, 1); }
.proto-tag { font: 500 11px/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--warn); }
.proto p.lede { margin: 6px 0 14px; font-size: 13.5px; color: var(--fg-2); }
.proto label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.proto input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.pgroup { padding: 12px 0; box-shadow: 0 -1px 0 var(--line); }
.readout { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--fg-2); margin-top: 8px; }
.readout code { font: 500 11.5px/1.35 var(--font-mono); color: var(--fg); }
.pbtn { height: 38px; padding: 0 14px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--line-strong); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.pbtn:hover { background: var(--bg-hover); }
.boot { padding: 48px var(--gutter); text-align: center; color: var(--fg-2); }
.boot b { display: block; font: 700 22px/1.2 var(--font-display); color: var(--fg); margin-bottom: 6px; }

/* ---------- wider screens ---------- */
@media (min-width: 640px) {
  .kf, .two, .cards, .btiles, .wd, .now { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .btiles > :first-child { grid-column: 1 / -1; }
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cov { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .lcards { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    box.innerHTML = PAL.length ? PAL.map((r, i) => `<button class="pal-item" role="option" data-act="pal" data-v="${i}" aria-selected="${i === S.palSel}"><span class="pal-k">${esc(r.kind)}</span><span class="pal-t">${r.html}</span></button>`).join('') : `<div class="pal-empty">Nothing in this brief matches “${esc(S.palQ)}”. Names work without accents, e.g. kukula, zagan.</div>`;
    if (keep) { const el = $$('.pal-item')[S.palSel]; if (el) el.scrollIntoView({ block: 'nearest' }); }
  }
  function choosePal(i) {
    const r = PAL[i]; if (!r) return; closeOverlay();
    if (r.stage) { goStage(r.stage, { top: true }); return; }
    const it = r.it;
    if (!it.part) { S.srcTier = 'all'; goStage('sources', { rerender: true }); requestAnimationFrame(() => focusAnchor(it.id)); return; }
    S.orbatType = 'all'; S.capTab = 'all'; S.mediaType = 'all'; S.learnDomain = 'all';
    if (it.orbat != null) { const ps = it.orbat.split('.'); for (let k = 1; k <= ps.length; k++) S.orbatOpen.add(ps.slice(0, k).join('.')); S.obSel = it.orbat; }
    if (it.tie != null) S.tie = it.tie;
    if (/^tie\.\d+$/.test(it.id)) S.tie = +it.id.split('.')[1];
    if (it.unit) S.unitSel = it.unit;
    if (it.claim) { S.open.add(it.id); S.closed.delete(it.id); }
    if (it.leader != null || /^lead\.\d+\./.test(it.id)) { const li = it.leader != null ? it.leader : +it.id.split('.')[1]; goStage(PART_STAGE[it.part], { part: it.part, rerender: true }); setTimeout(() => { openLeader(li); if (it.claim) setTimeout(() => focusAnchor(it.id, $('.drawer')), 300); }, 80); return; }
    goStage(PART_STAGE[it.part], { part: it.part, anchor: it.id, rerender: true });
  }
  function openCountries() {
    S.overlay = 'countries'; document.body.style.overflow = 'hidden';
    const cur = S.d.iso3;
    $('#overlay').innerHTML = `<div class="scrim" data-act="close"></div><div class="cpick" role="dialog" aria-modal="true" aria-label="Choose a country brief"><div class="panel-h"><b>Country briefs</b><button class="ibtn" data-act="close" aria-label="Close">${icon('x')}</button></div>
      <ul>${MANIFEST.countries.map(c => `<li><button class="cp-item" data-act="country" data-v="${esc(c.iso3)}"${c.iso3 === cur ? ' aria-current="true"' : ''}>${c.flag ? `<img class="flag" src="data/${esc(c.flag)}" alt="">` : `<span class="iso">${esc(c.iso3.toUpperCase())}</span>`}<span class="cp-t"><b>${esc(c.name)}</b><small>${[c.status === 'validated' ? 'Validated' : 'Draft', c.sources ? plural(c.sources, 'source') : '', c.last_refresh ? `swept ${fmtDate(c.last_refresh)}` : ''].filter(Boolean).map(esc).join(' · ')}</small></span>${c.iso3 === cur ? '<span class="cp-cur">Open</span>' : icon('chevRight')}</button></li>`).join('')}</ul></div>`;
    setTimeout(() => { const b = $('.cp-item[aria-current]') || $('.cp-item'); if (b) b.focus(); }, 30);
  }
  function openProto() { S.overlay = 'proto'; $('#overlay').innerHTML = `<div class="proto" role="dialog" aria-label="Prototype controls" id="protoPanel"></div>`; renderProto(); }
  function renderProto() {
    const p = $('#protoPanel'); if (!p) return;
    const c = country(), now = today(), f = freshness(c.last_refresh, now), v = validation(c, now);
    p.innerHTML = `<div class="panel-h" style="margin-bottom:4px"><span class="proto-tag">Prototype controls · not part of the app</span><button class="ibtn" data-act="close" aria-label="Close">${icon('x')}</button></div>
      <p class="lede">Test the currency and validation rules. Each chip reads only its own date, so moving one never moves the other.</p>
      <div class="pgroup"><label for="simDays">Jump ahead in time: +${S.simDays} days</label><input id="simDays" type="range" min="0" max="60" step="1" value="${S.simDays}">
        <div class="readout"><span>Today</span><code>${esc(fmtDate(isoOf(now)))}</code><span>Currency</span><code>last_refresh ${esc(fmtDate(c.last_refresh))} → ${f.age}d → ${f.level.toUpperCase()}</code><span>Validation</span><code>last_reviewed ${v.state === 'validated' ? esc(fmtDate(v.on)) + ` → ${v.age}d` : '—'} → ${v.state.toUpperCase()}</code></div></div>
      <div class="pgroup"><button class="pbtn" data-act="sim-valid">${S.simValid ? 'Revert to draft' : 'Sign off as validated (demo)'}</button></div>
      <div class="pgroup" style="padding-bottom:0"><label>Theme</label><span class="seg"><button data-act="set-theme" data-v="" aria-pressed="${!S.theme}">System</button><button data-act="set-theme" data-v="dark" aria-pressed="${S.theme === 'dark'}">Dark</button><button data-act="set-theme" data-v="light" aria-pressed="${S.theme === 'light'}">Light</button></span></div>`;
    $('#simDays').addEventListener('input', e => { S.simDays = +e.target.value; refreshTime(); });
  }
  function refreshTime() { const y = window.scrollY; renderHeader(); renderStage(false); window.scrollTo({ top: y, behavior: 'instant' }); renderAside(); const r = $('#simDays'), focused = document.activeElement === r; renderProto(); if (focused) $('#simDays').focus(); }

  /* ===== theme ===== */
  function isDark() { const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches; }
  function setTheme(t) { S.theme = t || null; if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); try { if (t) localStorage.setItem('pb-theme', t); else localStorage.removeItem('pb-theme'); } catch (e) { /* storage blocked */ } renderHeader(); renderProto(); }

  /* ===== scroll: progress, scrollspy, back-to-top ===== */
  let ticking = false;
  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  function onScroll() {
    ticking = false; if (!S.d) return;
    const y = window.scrollY;
    const max = document.documentElement.scrollHeight - innerHeight, bar = $('.hdr-prog i'); if (bar) bar.style.transform = `scaleX(${max > 0 ? Math.min(1, y / max) : 0})`;
    $('#totop').hidden = y < innerHeight * 1.4;
    const parts = $$('.part[data-part]').filter(p => PART_STAGE[p.dataset.part]); if (!parts.length) return;
    const line = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hdr-cmp')) + 90;
    let cur = parts[0].dataset.part; for (const p of parts) { if (p.getBoundingClientRect().top <= line) cur = p.dataset.part; }
    if (innerHeight + y >= document.documentElement.scrollHeight - 4) cur = parts[parts.length - 1].dataset.part;
    if (cur !== S.part) setActivePart(cur);
  }
  function setActivePart(id) {
    S.part = id; setHash(id);
    $$('.sn').forEach(a => a.setAttribute('aria-current', a.dataset.part === id));
    $$('.toc ol a').forEach(a => { if (a.dataset.part === id) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
    const sn = $(`.sn[data-part="${id}"]`), bar = $('.subnav'); if (sn && bar) bar.scrollTo({ left: sn.offsetLeft - 16, behavior: reduceMotion() ? 'auto' : 'smooth' });
    renderAside();
  }

  /* ===== events ===== */
  function toggleClaim(el) {
    const id = el.dataset.claim, open = !el.classList.contains('is-open');
    el.classList.toggle('is-open', open); const b = el.querySelector(':scope > .claim-meta'); if (b) b.setAttribute('aria-expanded', open);
    if (S.showAll) { if (open) S.closed.delete(id); else S.closed.add(id); } else { if (open) S.open.add(id); else S.open.delete(id); }
    S.active = open ? id : (S.active === id ? null : S.active);
    $$('.claim.is-active').forEach(x => x.classList.remove('is-active')); if (S.active) $$(`.claim[data-claim="${CSS.escape(S.active)}"]`).forEach(a => a.classList.add('is-active'));
    renderAside(true);
  }
  document.addEventListener('click', e => {
    const t = e.target; if (t.closest('a[target="_blank"]')) return;
    const a = t.closest('[data-act]'); if (a) { handle(a.dataset.act, a, e); return; }
    const cl = t.closest('[data-claim]'); if (cl && !t.closest('.claim-src') && !String(window.getSelection && window.getSelection()).trim()) toggleClaim(cl);
  });
  document.addEventListener('keydown', e => {
    const t = e.target, typing = /input|textarea|select/i.test(t.tagName || '') || t.isContentEditable;
    if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button' && t.dataset.act) { e.preventDefault(); handle(t.dataset.act, t, e); return; }
    if (e.key === 'Escape' && S.overlay) { closeOverlay(); return; }
    if (e.key === 'Escape' && S.explain) { S.explain = null; renderHeader(); return; }
    if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !typing)) { e.preventDefault(); if (S.overlay !== 'palette') openPalette(); return; }
    if (!typing && !S.overlay && !e.metaKey && !e.ctrlKey && !e.altKey && /^[1-5]$/.test(e.key)) goStage(STAGES[+e.key - 1].id, { top: true });
  });
  function handle(act, el, e) {
    const v = el.dataset.v;
    switch (act) {
      case 'stage': if (e.preventDefault) e.preventDefault(); if (S.overlay) closeOverlay(); if (el.dataset.id === S.stage) window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); else goStage(el.dataset.id, { top: !!el.dataset.top }); break;
      case 'part': if (e.preventDefault) e.preventDefault(); if (S.overlay) closeOverlay(); goPart(el.dataset.part); break;
      case 'claim': toggleClaim(el.closest('[data-claim]')); break;
      case 'showall': S.showAll = !S.showAll; S.open.clear(); S.closed.clear(); $$('.switch[data-act="showall"]').forEach(x => x.setAttribute('aria-pressed', S.showAll)); $$('[data-claim]').forEach(c => { c.classList.toggle('is-open', S.showAll); const b = c.querySelector(':scope > .claim-meta'); if (b) b.setAttribute('aria-expanded', S.showAll); }); break;
      case 'explain': S.explain = S.explain === el.dataset.k ? null : el.dataset.k; renderHeader(); break;
      case 'search': openPalette(); break;
      case 'countries': openCountries(); break;
      case 'country': if (v === S.d.iso3) closeOverlay(); else loadCountry(v); break;
      case 'close': closeOverlay(); break;
      case 'theme': setTheme(isDark() ? 'light' : 'dark'); break;
      case 'set-theme': setTheme(v); break;
      case 'proto': if (S.overlay === 'proto') closeOverlay(); else openProto(); break;
      case 'sim-valid': S.simValid = S.simValid ? null : isoOf(today()); refreshTime(); break;
      case 'pal': choosePal(+v); break;
      case 'totop': window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); break;
      case 'year': S.year = +v; rerenderPart('budget'); break;
      case 'pyear': S.pYear = v; rerenderPart('manpower'); break;
      case 'measure': S.measure = v; rerenderPart('budget'); break;
      case 'orbat': { const p = el.dataset.path, open = !S.orbatOpen.has(p); if (open) S.orbatOpen.add(p); else S.orbatOpen.delete(p); S.obSel = open ? p : (S.obSel === p ? null : S.obSel); el.setAttribute('aria-expanded', open); el.nextElementSibling.classList.toggle('open', open); $$('.unit.sel').forEach(u => u.classList.remove('sel')); $$('.map-dot').forEach(g => g.classList.toggle('sel', g.dataset.path === S.obSel)); if (S.obSel) { const u = $(`.unit[data-anchor="orbat.${S.obSel}"]`); if (u) u.classList.add('sel'); } break; }
      case 'ob-dot': { const p = el.dataset.path; S.obSel = p; S.orbatType = 'all'; S.orbatOpen.add(p); rerenderPart('force'); requestAnimationFrame(() => { const u = $(`.unit[data-anchor="orbat.${p}"]`); if (u) u.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' }); }); break; }
      case 'orbat-all': S.orbatOpen.clear(); if (v === '1') walkOrbat(S.d.force.orbat, (n, p) => S.orbatOpen.add(p)); rerenderPart('force'); break;
      case 'orbat-type': S.orbatType = v; rerenderPart('force'); break;
      case 'cap': S.capTab = v; rerenderPart('capabilities'); break;
      case 'mtype': S.mediaType = v; rerenderPart('leaders'); break;
      case 'rail-step': { const r = $('#' + (el.dataset.rail || 'mrail')); if (r) r.scrollBy({ left: (+v) * Math.max(260, r.clientWidth * .8), behavior: reduceMotion() ? 'auto' : 'smooth' }); break; }
      case 'leader': openLeader(+v); break;
      case 'tie': S.tie = +v; rerenderPart('ties'); break;
      case 'learn': S.learnDomain = v; rerenderPart('learn'); break;
      case 'unit': if (e.preventDefault) e.preventDefault(); if (el.tagName === 'A') { S.unitSel = v; goPart('units'); rerenderPart('units'); } else { S.unitSel = S.unitSel === v ? null : v; rerenderPart('units'); } break;
      case 'srctier': S.srcTier = v; renderStage(false); break;
      case 'copy-tp': copyTalkingPoints(); break;
    }
  }
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (stageById(h) && h !== S.stage) goStage(h); else if (PART_STAGE[h] && h !== S.part) goPart(h); });
  let wasDesk = null;
  window.addEventListener('resize', () => { if (!S.d) return; measureHeader(); const dk = isDesktop(); if (dk !== wasDesk) { wasDesk = dk; syncOnlyDesktop(); } renderAside(); });
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (S.d) renderHeader(); });

  /* ===== boot: data/countries.json lists the briefs; each renders only from its own file (and the map file it names) ===== */
  try { const t = localStorage.getItem('pb-theme'); if (t === 'dark' || t === 'light') { S.theme = t; document.documentElement.setAttribute('data-theme', t); } } catch (e) { /* storage blocked */ }
  const getJSON = u => fetch(u, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(`${u} returned HTTP ${r.status}`); return r.json(); });
  function pickCountry() {
    const has = id => MANIFEST.countries.some(c => c.iso3 === id);
    let q = null, saved = null;
    try { q = new URLSearchParams(location.search).get('c'); } catch (e) { /* no URL access */ }
    try { saved = localStorage.getItem('pb-country'); } catch (e) { /* storage blocked */ }
    return [q, saved, MANIFEST.default].find(x => x && has(x)) || (MANIFEST.countries[0] || {}).iso3;
  }
  function bootError(what, err) { $('#main').innerHTML = `<div class="boot"><b>Brief data could not be loaded</b>${esc(what)} did not load (${esc(err.message)}). The brief renders only from its data files, so nothing is shown rather than a stale copy.</div>`; }
  function loadCountry(iso, first) {
    const entry = MANIFEST.countries.find(c => c.iso3 === iso);
    if (!entry) { bootError('The country list', new Error(`no country "${iso}"`)); return Promise.resolve(); }
    const file = 'data/' + entry.file;
    return getJSON(file)
      .then(d => (d.geo ? getJSON('data/' + d.geo).catch(() => null) : Promise.resolve(null)).then(geo => [d, geo]))
      .then(([d, geo]) => {
        if (S.overlay) closeOverlay();
        if (!first) Object.assign(S, freshState(), { theme: S.theme });
        S.d = d; S.geo = geo; prepare(d);
        try { localStorage.setItem('pb-country', d.iso3); } catch (e) { /* storage blocked */ }
        try { history.replaceState(null, '', `?c=${encodeURIComponent(d.iso3)}${first ? location.hash : '#brief'}`); } catch (e) { /* sandboxed frame */ }
        document.title = `${d.name} · Pocket Brief`;
        const h = first ? location.hash.slice(1) : ''; if (stageById(h)) S.stage = h; else if (PART_STAGE[h]) S.stage = PART_STAGE[h];
        S.part = stageParts(stageById(S.stage))[0] ? stageParts(stageById(S.stage))[0].id : null; wasDesk = isDesktop();
        renderHeader(); renderRail(); renderTabbar(); renderStage(false); renderAside();
        if (PART_STAGE[h]) requestAnimationFrame(() => scrollToPart(h)); else if (!first) window.scrollTo({ top: 0, behavior: 'instant' });
      })
      .catch(err => bootError(file, err));
  }
  getJSON('data/countries.json')
    .then(m => { MANIFEST = Object.assign({ countries: [] }, m); return loadCountry(pickCountry(), true); })
    .catch(err => bootError('data/countries.json', err));
})();
</script>
